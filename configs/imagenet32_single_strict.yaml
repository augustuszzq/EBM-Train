benchmark:
  name: imagenet32
  conditional: true
  num_classes: 1000
  image_size: 32
  data_root: ./data/imagenet32
  split_train: train
  split_val: val

model:
  family: ebm_conv
  n_f: 96
  conditioning: projection

train:
  steps: 300000
  batch_size: 128
  K: 100
  lr: 0.0001

pipeline:
  pipe_stages: 1
  weight_mode: deep_only
  last2_beta: 0.01
  stage_weights: [1.0]

eval:
  num_images: 50000
  images_per_class: 50
  classifier_metric: imagenet_top1
