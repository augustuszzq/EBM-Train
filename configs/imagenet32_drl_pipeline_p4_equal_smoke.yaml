benchmark:
  name: imagenet32
  conditional: true
  num_classes: 1000
  image_size: 32
  data_root: /eagle/lc-mpi/Zhiqing/polaris_ebm/data/imagenet32
  split_train: train
  split_val: val

model:
  family: drl_resnet_energy
  conditioning: ignored_labels_unconditional_energy
  ch: 128
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 4
  attention_resolutions: []
  spectral_norm: true

train:
  steps: 500
  batch_size: 128
  K: 100
  lr: 0.00005
  step_size: 0.005
  noise_std: 0.005
  clamp_x: true
  max_grad_norm: 0.0

pipeline:
  pipe_stages: 4
  weight_mode: uniform
  last2_beta: 0.01
  stage_weights: [0.25, 0.25, 0.25, 0.25]
  skip_optimizer_until_full_diagonal: true

eval:
  num_images: 50000
  images_per_class: 50
  classifier_metric: unconditional_first_pass
